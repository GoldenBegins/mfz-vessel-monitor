name: MarineTraffic Playwright Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/marinetraffic-playwright

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run read-only MarineTraffic probe
        run: python tools/marinetraffic_playwright_probe.py

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marinetraffic-playwright-probe
          path: artifacts/marinetraffic_probe/
          if-no-files-found: warn
          retention-days: 7
